<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Security and anti-bot detection headers -->
    <meta
      http-equiv="Content-Security-Policy"
      content="upgrade-insecure-requests"
    />
    <meta name="referrer" content="no-referrer" />
    <meta name="robots" content="noindex, nofollow" />

    <!-- Prevent Cloudflare challenge detection -->
    <meta name="cf-challenge" content="ignore" />
    <meta name="cf-cache-status" content="BYPASS" />

    <title>Orange Cheese Pizza</title>

    <!-- Pre-emptive script to help with Cloudflare issues -->
    <script type="text/javascript">
      // Prevent Cloudflare bot detection
      window.botDetection = false;

      // Intercept and prevent Cloudflare challenges
      window.addEventListener("beforeunload", function (event) {
        // Prevent redirects to Cloudflare challenge pages
        if (
          window.location.href.includes("cloudflare") ||
          window.location.href.includes("cdn-cgi")
        ) {
          event.preventDefault();
          window.stop();
          return false;
        }
      });

      // Override fetch to handle Cloudflare issues
      const originalFetch = window.fetch;
      window.fetch = async function (resource, init) {
        try {
          const response = await originalFetch(resource, init);

          // If response is a Cloudflare challenge (401), retry with additional headers
          if (
            response.status === 401 &&
            (response.url.includes("cloudflare") ||
              response.url.includes("cdn-cgi"))
          ) {
            // Create new headers with anti-bot detection flags
            const newInit = { ...init };
            const newHeaders = new Headers(init?.headers || {});
            newHeaders.set("X-Requested-With", "XMLHttpRequest");
            newHeaders.set("Accept", "application/json");
            newHeaders.set("CF-Challenge-Bypass", "true");
            newInit.headers = newHeaders;

            // Retry the fetch
            return originalFetch(resource, newInit);
          }

          return response;
        } catch (error) {
          console.error("Fetch error:", error);
          throw error;
        }
      };
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
